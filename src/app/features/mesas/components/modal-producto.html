<div class="modal-header border-0 bg-light py-3">
    <h5 class="fw-bold mb-0">Seleccionar Productos</h5>
    <button type="button" class="btn-close shadow-none" (click)="alCerrar.emit()"></button>
</div>

<div class="modal-body p-0">
    <div class="p-3 sticky-top bg-white border-bottom shadow-sm">
        <div class="input-group mb-3 border rounded-3 overflow-hidden shadow-sm">
            <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-0 shadow-none" placeholder="Buscar por nombre..."
                [(ngModel)]="busqueda" (input)="filtrar()">
        </div>

        <div class="d-flex gap-2 overflow-auto pb-2 categorias-bar">
            <button *ngFor="let cat of categorias" (click)="seleccionarCategoria(cat)"
                class="btn btn-sm rounded-pill px-3 fw-bold text-nowrap transition-all"
                [ngClass]="categoriaSeleccionada === cat ? 'btn-primary shadow' : 'btn-outline-secondary'">
                {{cat}}
            </button>
        </div>
    </div>

    <div class="productos-list p-3 bg-light" style="max-height: 55vh; overflow-y: auto;">
        <div *ngFor="let p of productosFiltrados; trackBy: trackByProducto"
            class="producto-card d-flex align-items-center bg-white p-3 rounded-4 mb-3 border shadow-sm"
            [ngClass]="{'opacity-75': getStockVisual(p) === 0 && !seleccionados[p.id]}">

            <div class="position-relative me-3">
                <img [src]="p.imagen || 'assets/img/default.png'" class="rounded-3 border shadow-sm"
                    style="width: 70px; height: 70px; object-fit: cover;">

                <span
                    class="position-absolute top-0 start-0 translate-middle badge rounded-pill border border-white shadow"
                    [ngClass]="getStockVisual(p) <= 5 ? 'bg-danger' : 'bg-dark'">
                    {{ getStockVisual(p) }} <small>disp</small>
                </span>
            </div>

            <div class="flex-grow-1">
                <small class="text-primary fw-bold text-uppercase"
                    style="font-size: 0.7rem;">{{p.categoriaNombre}}</small>
                <h6 class="mb-0 fw-bold text-dark text-truncate" style="max-width: 150px;">{{p.nombre}}</h6>
                <span class="fw-bold fs-5 text-dark">{{p.precioActual | currency:'COP':'$':'1.0-0'}}</span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <div class="d-flex align-items-center bg-light rounded-pill border p-1 shadow-inner">
                    <button class="btn btn-sm btn-white rounded-circle shadow-sm" (click)="restar(p)"
                        [disabled]="!seleccionados[p.id]">
                        <i class="bi bi-dash"></i>
                    </button>

                    <span class="px-2 fw-bold" style="min-width: 30px; text-align: center;">
                        {{ seleccionados[p.id] || 0 }}
                    </span>

                    <button class="btn btn-sm btn-white rounded-circle shadow-sm" (click)="sumar(p)"
                        [disabled]="getStockVisual(p) <= 0">
                        <i class="bi bi-plus"></i>
                    </button>
                </div> 

                <button class="btn btn-primary rounded-4 px-3 fw-bold shadow-sm" *ngIf="seleccionados[p.id] > 0"
                    (click)="confirmar(p)">
                    OK
                </button>
            </div>
        </div>

        <div *ngIf="productosFiltrados.length === 0" class="text-center py-5">
            <i class="bi bi-emoji-frown display-4 text-muted opacity-25"></i>
            <p class="text-muted mt-2">No encontramos ese producto...</p>
        </div>
    </div>
</div>

<div class="modal-footer bg-light border-0">
    <button class="btn btn-secondary rounded-3 px-4" (click)="alCerrar.emit()">Cerrar Catálogo</button>
</div>
