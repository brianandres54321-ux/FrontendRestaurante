<div class="modal fade show" tabindex="-1" *ngIf="visible" style="display:block;background:rgba(0,0,0,0.4)">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">{{ esEdicion ? 'Editar Producto' : 'Nuevo Producto' }}</h5>
                <button type="button" class="btn-close" (click)="cerrarModal()"></button>
            </div>

            <div class="modal-body">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input class="form-control" [(ngModel)]="producto.nombre" placeholder="Ej. Salchipapa Especial">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Código de barras (opcional)</label>
                        <input class="form-control" [(ngModel)]="producto.codigoBarras"
                            placeholder="Escanear o escribir">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="2" [(ngModel)]="producto.descripcion"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" [(ngModel)]="producto.categoriaId">
                            <option [ngValue]="undefined">Seleccionar</option>
                            <option *ngFor="let c of categorias" [ngValue]="c.id">{{c.nombre}}</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Precio de Venta *</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" min="0" [(ngModel)]="producto.precioVenta">
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Precio de Venta *</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" [(ngModel)]="producto.precioVenta">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Stock Actual</label>
                            <div class="input-group">
                                <span class="input-group-text">📦</span>

                                <input *ngIf="!esEdicion" type="number" class="form-control"
                                    [(ngModel)]="producto.stockInicial" placeholder="0">

                                <input *ngIf="esEdicion" type="number" class="form-control"
                                    [(ngModel)]="producto.stockInicial">
                            </div>
                            <small class="text-muted" *ngIf="esEdicion">
                                Nota: Editando el stock actual directamente.
                            </small>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Costo</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" [(ngModel)]="producto.costo">
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Imagen del producto</label>
                        <input type="file" class="form-control" accept="image/*"
                            (change)="onImagenSeleccionada($event)">
                    </div>

                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" (click)="guardar()">
                    {{ esEdicion ? 'Actualizar Cambios' : 'Guardar Producto' }}
                </button>
            </div>

        </div>
    </div>
</div>
