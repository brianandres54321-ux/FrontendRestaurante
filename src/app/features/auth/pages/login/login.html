<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 400px;">

        <h3 class="text-center mb-4">
            Iniciar sesión
        </h3>

        <form (ngSubmit)="login()" #loginForm="ngForm">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Correo
                </label>

                <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control"
                    placeholder="Ingrese su correo">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Contraseña
                </label>

                <input type="password" id="password" name="password" [(ngModel)]="password" required
                    class="form-control" placeholder="Ingrese su contraseña">
            </div>

            <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100">

                Ingresar

            </button>

        </form>

    </div>

</div>
