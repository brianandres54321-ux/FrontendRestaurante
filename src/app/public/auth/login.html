<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="width: 400px;">

        <h3 class="text-center mb-4">
            Iniciar sesión
        </h3>

        <form (ngSubmit)="login()" #loginForm="ngForm">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Correo
                </label>

                <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control"
                    placeholder="Ingrese su correo" [disabled]="isLoading">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Contraseña
                </label>

                <div class="input-group">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" name="password"
                        [(ngModel)]="password" required class="form-control" placeholder="Ingrese su contraseña"
                        [disabled]="isLoading">

                    <button class="btn btn-outline-secondary" type="button" (click)="toggleShowPassword()"
                        [disabled]="isLoading">
                        <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                    </button>
                </div>
            </div>

            <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn btn-primary w-100">

                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"
                    aria-hidden="true"></span>

                <span>{{ isLoading ? 'Cargando...' : 'Ingresar' }}</span>

            </button>

            <p class="text-center text-muted small mt-3 mb-0">
                ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
            </p>

        </form>

    </div>

</div>
