<section class="features px-3 py-5">
    <h2 class="text-center fw-bold mb-5">Todo lo que necesitas para operar</h2>

    <div class="container">
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3" *ngFor="let f of funcionalidades">
                <div class="feature-card h-100 p-4 rounded-4 shadow-sm">
                    <div class="feature-icon mb-3">
                        <i class="bi" [class]="f.icono"></i>
                    </div>
                    <h5 class="fw-bold mb-2">{{ f.titulo }}</h5>
                    <p class="text-muted small mb-0">{{ f.descripcion }}</p>
                </div>
            </div>
        </div>
    </div>
</section>
