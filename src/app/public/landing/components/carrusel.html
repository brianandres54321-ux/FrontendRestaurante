<div class="carrusel">

    <button class="carrusel-flecha carrusel-flecha--izq" type="button" (click)="anterior()" aria-label="Anterior">
        <i class="bi bi-chevron-left"></i>
    </button>

    <div class="carrusel-track">
        <div class="carrusel-slide" *ngFor="let slide of slides; let i = index" [class.activo]="i === slideActual">
            <div class="carrusel-icono">
                <i class="bi" [class]="slide.icono"></i>
            </div>
            <h3 class="fw-bold mb-2">{{ slide.titulo }}</h3>
            <p class="text-muted mb-0">{{ slide.descripcion }}</p>
        </div>
    </div>

    <button class="carrusel-flecha carrusel-flecha--der" type="button" (click)="siguienteManual()" aria-label="Siguiente">
        <i class="bi bi-chevron-right"></i>
    </button>

    <div class="carrusel-dots">
        <button *ngFor="let slide of slides; let i = index" class="carrusel-dot" [class.activo]="i === slideActual"
            (click)="irA(i)" [attr.aria-label]="'Ir a la diapositiva ' + (i + 1)">
        </button>
    </div>

</div>
