<section class="contacto-section px-3 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-7">

                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-2">¿Tienes dudas? Contáctanos</h2>
                    <p class="text-muted">Cuéntanos sobre tu negocio y te ayudamos a arrancar.</p>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4">

                    <div *ngIf="enviado" class="alert alert-success d-flex align-items-center gap-2 mb-4">
                        <i class="bi bi-check-circle-fill"></i>
                        ¡Gracias! Recibimos tu mensaje, te contactaremos pronto.
                    </div>

                    <form (ngSubmit)="enviar()" #contactoForm="ngForm">
                        <div class="row g-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" [(ngModel)]="nombre" required class="form-control"
                                    placeholder="Tu nombre">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Correo</label>
                                <input type="email" name="correo" [(ngModel)]="correo" required email
                                    class="form-control" placeholder="tucorreo@ejemplo.com">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Mensaje</label>
                                <textarea name="mensaje" [(ngModel)]="mensaje" required rows="4" class="form-control"
                                    placeholder="Cuéntanos qué necesitas..."></textarea>
                            </div>
                        </div>

                        <button type="submit" [disabled]="contactoForm.invalid"
                            class="btn btn-primary w-100 mt-4">
                            Enviar mensaje
                        </button>
                    </form>

                </div>

            </div>
        </div>
    </div>
</section>
