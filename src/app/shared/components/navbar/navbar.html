<div class="sidebar" [class.collapsed]="collapsed">

    <!-- HEADER (solo desktop) -->
    <div class="sidebar-header">
        <span class="title">Facturación</span>
        <button (click)="toggleSidebar()" [title]="collapsed ? 'Expandir' : 'Colapsar'">
            <i class="bi" [class.bi-list]="collapsed" [class.bi-layout-sidebar]="!collapsed"></i>
        </button>
    </div>

    <!-- EMPRESA — desktop: columna / móvil: fila con salir -->
    <div class="empresa">

        <!-- Info empresa y rol -->
        <div class="empresa-info">
            <span class="empresa-nombre">
                <i class="bi bi-building me-1"></i> {{ empresaNombre }}
            </span>
            <div class="empresa-rol">
                <span class="rol-pill" [class.rol-admin]="esAdmin" [class.rol-cajero]="esCajero"
                    [class.rol-mesero]="esMesero">
                    {{ rol }}
                </span>
                <span style="font-size:11px; color:#94a3b8;">{{ nombreUsuario }}</span>
            </div>
        </div>

        <!-- Botón salir — solo visible en móvil dentro del topbar -->
        <div class="logout logout-mobile">
            <button (click)="logout()">
                <i class="bi bi-box-arrow-right"></i>
                <span>Salir</span>
            </button>
        </div>

    </div>

    <!-- MENU -->
    <nav class="menu">
        <a routerLink="/mesas" routerLinkActive="active" title="Mesas">
            <i class="bi bi-grid-3x3-gap"></i>
            <span>Mesas</span>
        </a>

        <a [routerLink]="['/cocina']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            title="Vista Cocina" target="_self">
            <i class="bi bi-fire"></i>
            <span>Cocina</span>
        </a>

        <a *ngIf="esAdminOCajero" [routerLink]="['/pedidos']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Pedidos">
            <i class="bi bi-receipt"></i>
            <span>Pedidos</span>
        </a>

        <a *ngIf="esAdminOCajero" [routerLink]="['/cierre-caja']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Cierre de Caja">
            <i class="bi bi-cash-stack"></i>
            <span>Cierre de Caja</span>
        </a>

        <a *ngIf="esAdmin" [routerLink]="['/productos']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Productos">
            <i class="bi bi-box-seam"></i>
            <span>Productos</span>
        </a>

        <a *ngIf="esAdmin" [routerLink]="['/secciones']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Secciones">
            <i class="bi bi-diagram-3"></i>
            <span>Secciones</span>
        </a>

        <a *ngIf="esAdmin" [routerLink]="['/cupones']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Cupones">
            <i class="bi bi-ticket-perforated"></i>
            <span>Cupones</span>
        </a>

        <a *ngIf="esAdmin" [routerLink]="['/reportes']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Reportes">
            <i class="bi bi-bar-chart-line"></i>
            <span>Reportes</span>
        </a>

        <a *ngIf="esAdmin" [routerLink]="['/usuarios']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Usuarios">
            <i class="bi bi-people"></i>
            <span>Usuarios</span>
        </a>

        <a *ngIf="esAdmin" [routerLink]="['/empresa']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" title="Mi Empresa">
            <i class="bi bi-building"></i>
            <span>Mi Empresa</span>
        </a>
    </nav>

    <!-- LOGOUT (solo desktop) -->
    <div class="logout logout-desktop">
        <button (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Salir</span>
        </button>
    </div>

</div>
